<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 297" role="img" aria-labelledby="title desc"><title id="title">Build a byte address</title><desc id="desc">For 8(%rdi,%rsi,8), with RDI=0x1000 and RSI=1, add displacement 8, base 0x1000 and index times scale 1×8 to obtain 0x1010.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="297" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Build a byte address</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Component</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Contribution</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">displacement</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">8</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">base</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x1000</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">index × scale</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1 × 8</text><text x="240" y="265" text-anchor="middle" font-size="25" font-weight="700" fill="#27283f">Address = 0x1010</text></g></svg>
