<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 437" role="img" aria-labelledby="title desc"><title id="title">A shared function convention</title><desc id="desc">The first six integer or pointer arguments use RDI, RSI, RDX, RCX, R8 and R9. A long or pointer result uses RAX.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="437" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">A shared function convention</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Argument</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Register</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RDI</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">2</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RSI</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">3</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RDX</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="130.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">4</text><text x="350.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RCX</text><rect x="20" y="270" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">5</text><text x="350.0" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">R8</text><rect x="20" y="315" width="440" height="43" fill="#fff"/><text x="130.0" y="344" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">6</text><text x="350.0" y="344" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">R9</text><rect x="20" y="360" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="389" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">long result</text><text x="350.0" y="389" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RAX</text></g></svg>
