<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 315" role="img" aria-labelledby="title desc"><title id="title">A comparison chooses a path</title><desc id="desc">After comparing x with zero, ZF=1 means equal and JE takes the jump. ZF=0 means not equal and execution continues with the next instruction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="315" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">A comparison chooses a path</text><rect x="60" y="65" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="95" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">cmpq $0,%rdi</text><text x="240.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Compare x with zero</text><path d="M170 153 L120 205" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><path d="M310 153 L360 205" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="210" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="120.0" y="240" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">ZF = 1</text><text x="120.0" y="271" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">JE jumps</text><rect x="260" y="210" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="360.0" y="240" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">ZF = 0</text><text x="360.0" y="271" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">JE falls through</text></g></svg>
