<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 437" role="img" aria-labelledby="title desc"><title id="title">Choose the matching condition</title><desc id="desc">Equality uses ZF; signed less-than compares SF with OF; signed greater also excludes equality; unsigned comparisons use CF and ZF. Jcc and SETcc use matching predicates.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="437" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Choose the matching condition</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Suffix</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Condition</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">E / NE</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">ZF / not ZF</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">L / GE</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">SF ≠ OF / SF = OF</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">G</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">not ZF and SF = OF</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="130.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">LE</text><text x="350.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">ZF or SF ≠ OF</text><rect x="20" y="270" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">B / AE</text><text x="350.0" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">CF / not CF</text><rect x="20" y="315" width="440" height="43" fill="#fff"/><text x="130.0" y="344" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">A</text><text x="350.0" y="344" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">not CF and not ZF</text><rect x="20" y="360" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="389" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">BE</text><text x="350.0" y="389" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">CF or ZF</text></g></svg>
