<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Join high and low counter halves</title><desc id="desc">RDTSC returns the high 32 bits in EDX and low 32 bits in EAX. With high equal to 2 and low equal to 7, shifting the widened high half left 32 and ORing the low half yields 8589934599.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="320" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Join high and low counter halves</text><rect x="20" y="70" width="210" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="125.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">High: EDX</text><text x="125.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">0x00000002</text><rect x="250" y="70" width="210" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="355.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Low: EAX</text><text x="355.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">0x00000007</text><text x="240" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#27283f">((unsigned long)high &lt;&lt; 32) | low</text><text x="240" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#27283f">0x0000000200000007</text><text x="240" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="#27283f">8589934599</text></g></svg>
