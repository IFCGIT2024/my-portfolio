<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 257" role="img" aria-labelledby="title desc"><title id="title">Three code bytes; eight data bytes</title><desc id="desc">The encoding 48 89 d8 represents movq %rbx,%rax. Its three bytes select 64-bit width, the MOV operation and register operands.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="257" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Three code bytes; eight data bytes</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Byte</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Role</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">48</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">64-bit REX prefix</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">89</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">MOV opcode</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">d8</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">operand fields</text></g></svg>
