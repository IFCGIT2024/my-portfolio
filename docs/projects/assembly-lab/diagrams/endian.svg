<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" role="img" aria-labelledby="title desc"><title id="title">Little endian: low byte first</title><desc id="desc">The four-byte value 0x12345678 is stored as bytes 78, 56, 34 and 12 at increasing addresses. All byte values shown are hexadecimal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="302" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Little endian: low byte first</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Address</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Stored byte</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x100</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x78</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x101</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x56</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x102</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x34</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="130.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x103</text><text x="350.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x12</text></g></svg>
