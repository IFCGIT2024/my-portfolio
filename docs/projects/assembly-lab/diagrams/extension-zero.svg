<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 257" role="img" aria-labelledby="title desc"><title id="title">Add zeros above an unsigned byte</title><desc id="desc">Zero extension turns byte 0x80 into 32-bit 0x00000080, still unsigned 128. Writing EAX also clears the high half of RAX.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="257" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Add zeros above an unsigned byte</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Stage</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Pattern / value</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">byte input</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x80 = 128</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">32-bit destination</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x00000080</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">full RAX</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">128</text></g></svg>
