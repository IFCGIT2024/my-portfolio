<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" role="img" aria-labelledby="title desc"><title id="title">One result, four distinct facts</title><desc id="desc">Eight-bit 127 plus 1 stores 0x80. The result is nonzero with its top bit set; there is signed overflow but no unsigned carry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="302" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">One result, four distinct facts</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="93.33333333333333" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Flag</text><text x="240.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Value</text><text x="386.66666666666663" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Reason</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">ZF</text><text x="240.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0</text><text x="386.66666666666663" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">not zero</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">SF</text><text x="240.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="386.66666666666663" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">top bit is 1</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">CF</text><text x="240.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0</text><text x="386.66666666666663" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">no carry</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">OF</text><text x="240.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="386.66666666666663" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">overflow</text></g></svg>
