<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" role="img" aria-labelledby="title desc"><title id="title">A stable base for a local</title><desc id="desc">After saving RBP and establishing the frame base, saved RBP is at offset 0 and the caller continuation is at offset +8. The local long is at offset −8. RSP points below the reserved local area.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="302" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">A stable base for a local</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Address</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Contents</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RBP + 8</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">return address</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RBP</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">saved RBP</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RBP − 8</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">local long t</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="130.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">RBP − 16</text><text x="350.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">reserved space</text></g></svg>
