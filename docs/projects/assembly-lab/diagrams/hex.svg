<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 271" role="img" aria-labelledby="title desc"><title id="title">A byte needs two hex digits</title><desc id="desc">The hexadecimal byte A6 is binary 10100110. Each hex digit represents four bits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="271" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">A byte needs two hex digits</text><rect x="20" y="65" width="210" height="83" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="125.0" y="95" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Hex A = decimal 10</text><text x="125.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">1010</text><rect x="250" y="65" width="210" height="83" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="355.0" y="95" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Hex 6 = decimal 6</text><text x="355.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">0110</text><text x="20" y="196" text-anchor="start" font-size="20" font-weight="700" fill="#27283f">Together: 0xA6</text><rect x="20" y="209" width="49" height="43" rx="5" fill="#5a42b4"/><text x="44.5" y="239" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="75" y="209" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="99.5" y="239" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="130" y="209" width="49" height="43" rx="5" fill="#5a42b4"/><text x="154.5" y="239" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="185" y="209" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="209.5" y="239" text-anchor="middle" fon