<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">A strict boundary selects one path</title><desc id="desc">Comparing signed x with 3 selects return 1 for x less than 3, including 2; equality and larger values select return 2. Every selected path returns.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="320" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">A strict boundary selects one path</text><rect x="60" y="65" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="95" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Compare signed x with 3</text><text x="240.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">x &lt; 3 ?</text><path d="M175 153 L120 210" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><path d="M305 153 L360 210" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="215" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="120.0" y="245" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">True: x = 2</text><text x="120.0" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">return 1</text><rect x="260" y="215" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="360.0" y="245" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">False: x = 3</text><text x="360.0" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">return 2</text></g></svg>
