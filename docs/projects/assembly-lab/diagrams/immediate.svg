<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 237" role="img" aria-labelledby="title desc"><title id="title">Copy a constant into a register</title><desc id="desc">The instruction movq $7,%rax copies the immediate constant 7 into the 64-bit register RAX. The dollar sign marks the constant; the percent sign marks the register.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="237" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Copy a constant into a register</text><rect x="20" y="70" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="120.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Constant $7</text><text x="120.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">7</text><rect x="260" y="70" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="360.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Register %rax</text><text x="360.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">7</text><path d="M220 114 L255 114" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#27283f">movq $7,%rax</text></g></svg>
