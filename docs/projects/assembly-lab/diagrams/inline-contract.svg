<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" role="img" aria-labelledby="title desc"><title id="title">Declare the compiler interface</title><desc id="desc">The template contains assembler instructions. Outputs, inputs and clobbers describe its interface to GCC; clobbers are declarations of additional changed state, not automatic restore instructions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="302" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Declare the compiler interface</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="130.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Section</text><text x="350.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">What GCC learns</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">template</text><text x="350.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">assembler operations</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="130.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">outputs</text><text x="350.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">C values written</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="130.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">inputs</text><text x="350.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">C values read</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="130.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">clobbers</text><text x="350.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">other changed state</text></g></svg>
