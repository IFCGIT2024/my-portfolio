<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img" aria-labelledby="title desc"><title id="title">Load the pointed-to value</title><desc id="desc">With RDI containing 0x100 and a long value 23 at that address, movq (%rdi),%rax reads the memory value into RAX. RDI remains 0x100.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="276" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Load the pointed-to value</text><rect x="20" y="70" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="120.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Memory at 0x100</text><text x="120.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">23</text><rect x="260" y="70" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="360.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Register RAX</text><text x="360.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">23</text><path d="M220 114 L255 114" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#27283f">movq (%rdi),%rax</text><text x="240" y="247" text-anchor="middle" font-size="21" font-weight="500" fill="#27283f">RDI stays 0x100.</text></g></svg>
