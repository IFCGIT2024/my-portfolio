<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 401" role="img" aria-labelledby="title desc"><title id="title">Direction determines load or store</title><desc id="desc">movq (%rdi),%rax loads memory into RAX. movq %rax,(%rdi) stores RAX into memory. RDI remains the address in either case.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="401" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Direction determines load or store</text><rect x="20" y="70" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="120.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Memory at RDI</text><text x="120.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">23</text><rect x="260" y="70" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="360.0" y="100" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Register RAX</text><text x="360.0" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">23</text><path d="M220 110 L255 110" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#27283f">Load: movq (%rdi),%rax</text><rect x="20" y="245" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="120.0" y="275" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Register RAX</text><text x="120.0" y="306" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">11</text><rect x="260" y="245" width="200" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="360.0" y="275" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Memory at RDI</text><text x="360.0" y="306" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">11</text><path d="M220 288 L255 288" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="370" text-anchor="middle" font-size="21" font-weight="700" fill="#27283f">Store: movq %rax,(%rdi)</text></g></svg>
