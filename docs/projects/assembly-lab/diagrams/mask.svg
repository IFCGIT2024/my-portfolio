<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">Keep only the low four bits</title><desc id="desc">The byte 10101100 AND 00001111 becomes 00001100, or decimal 12. Mask ones preserve input positions; mask zeros clear them.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="340" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Keep only the low four bits</text><text x="20" y="75" text-anchor="start" font-size="20" font-weight="700" fill="#27283f">Input: 0xac</text><rect x="20" y="88" width="49" height="43" rx="5" fill="#5a42b4"/><text x="44.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="75" y="88" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="99.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="130" y="88" width="49" height="43" rx="5" fill="#5a42b4"/><text x="154.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="185" y="88" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="209.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="240" y="88" width="49" height="43" rx="5" fill="#5a42b4"/><text x="264.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="295" y="88" width="49" height="43" rx="5" fill="#5a42b4"/><text x="319.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="350" y="88" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="374.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="405" y="88" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="429.5" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><text x="20" y="170" text-anchor="start" font-size="20" font-weight="700" fill="#27283f">AND mask: 0x0f</text><rect x="20" y="183" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="44.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="75" y="183" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="99.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="130" y="183" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="154.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="185" y="183" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="209.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="240" y="183" width="49" height="43" rx="5" fill="#5a42b4"/><text x="264.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="295" y="183" width="49" height="43" rx="5" fill="#5a42b4"/><text x="319.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="350" y="183" width="49" height="43" rx="5" fill="#5a42b4"/><text x="374.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="405" y="183" width="49" height="43" rx="5" fill="#5a42b4"/><text x="429.5" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="20" y="265" text-anchor="start" font-size="20" font-weight="700" fill="#27283f">Result: 0x0c = 12</text><rect x="20" y="278" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="44.5" y="308" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rect x="75" y="278" width="49" height="43" rx="5" fill="#eeeaf7"/><text x="99.5" y="308" text-anchor="middle" font-size="24" font-weight="700" fill="#37334b">0</text><rec