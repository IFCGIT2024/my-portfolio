<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 212" role="img" aria-labelledby="title desc"><title id="title">An address selects a location</title><desc id="desc">An eight-byte object beginning at 0x100 occupies 0x100 through 0x107. Address 0x108 begins the following space.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="212" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">An address selects a location</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="93.33333333333333" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Object</text><text x="240.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">First byte</text><text x="386.66666666666663" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Last byte</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">long X</text><text x="240.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x100</text><text x="386.66666666666663" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x107</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">next space</text><text x="240.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x108</text><text x="386.66666666666663" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">…</text></g></svg>
