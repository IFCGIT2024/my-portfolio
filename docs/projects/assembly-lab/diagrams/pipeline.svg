<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 409" role="img" aria-labelledby="title desc"><title id="title">Connect separately built functions</title><desc id="desc">The compiler and assembler produce object files. The linker connects object files and resolves references, producing an executable whose functions must obey the same calling convention.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="409" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Connect separately built functions</text><rect x="60" y="64" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="94" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">C compiler / assembler</text><text x="240.0" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">produce object files</text><path d="M240 151 L240 180" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="184" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="214" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Linker</text><text x="240.0" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">connect object files</text><path d="M240 271 L240 300" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="304" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="334" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Executable</text><text x="240.0" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">functions share an ABI</text></g></svg>
