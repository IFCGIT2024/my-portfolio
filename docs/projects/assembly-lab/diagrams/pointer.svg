<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 289" role="img" aria-labelledby="title desc"><title id="title">Follow an address to its data</title><desc id="desc">The pointer p in RDI holds 0x100. Following that address reaches a long whose value is 23. The address and its contents are different values.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="289" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Follow an address to its data</text><rect x="60" y="64" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="94" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Pointer in RDI</text><text x="240.0" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">p = 0x100</text><path d="M240 151 L240 180" fill="none" stroke="#5a42b4" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="184" width="360" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="240.0" y="214" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Memory beginning at 0x100</text><text x="240.0" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">*p = 23</text></g></svg>
