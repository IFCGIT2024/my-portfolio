<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 347" role="img" aria-labelledby="title desc"><title id="title">Count the low bit, then shift</title><desc id="desc">For unsigned x equal to 22, the low bits encountered are 0, 1, 1, 0 and 1. Adding those bits produces population count 3.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="347" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Count the low bit, then shift</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="93.33333333333333" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">x before</text><text x="240.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">x &amp; 1</text><text x="386.66666666666663" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">total</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">22</text><text x="240.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0</text><text x="386.66666666666663" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">11</text><text x="240.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="386.66666666666663" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">5</text><text x="240.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="386.66666666666663" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">2</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">2</text><text x="240.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0</text><text x="386.66666666666663" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">2</text><rect x="20" y="270" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="240.0" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">1</text><text x="386.66666666666663" y="299" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">3</text></g></svg>
