<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 257" role="img" aria-labelledby="title desc"><title id="title">PUSH moves the stack top down</title><desc id="desc">Starting with RSP=0x8000, pushq of value 7 subtracts eight and writes 7 at 0x7ff8. A matching pop reads 7 and restores RSP to 0x8000.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="257" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">PUSH moves the stack top down</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="93.33333333333333" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Stage</text><text x="240.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">RSP</text><text x="386.66666666666663" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Action</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Before</text><text x="240.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x8000</text><text x="386.66666666666663" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">no slot</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">PUSH 7</text><text x="240.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x7ff8</text><text x="386.66666666666663" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">write 7</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">POP</text><text x="240.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x8000</text><text x="386.66666666666663" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">read 7</text></g></svg>
