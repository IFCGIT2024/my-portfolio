<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 326" role="img" aria-labelledby="title desc"><title id="title">Same bits, different interpretation</title><desc id="desc">Eight one bits can mean unsigned 255 or signed negative 1. The signed reading is 255 minus 256.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="326" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">Same bits, different interpretation</text><text x="20" y="76" text-anchor="start" font-size="20" font-weight="700" fill="#27283f">Eight-bit pattern: 0xff</text><rect x="20" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="44.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="75" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="99.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="130" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="154.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="185" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="209.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="240" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="264.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="295" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="319.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="350" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="374.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="405" y="89" width="49" height="43" rx="5" fill="#5a42b4"/><text x="429.5" y="119" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><rect x="20" y="172" width="210" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="125.0" y="202" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Unsigned</text><text x="125.0" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">255</text><rect x="250" y="172" width="210" height="85" rx="10" fill="#f3f0ff" stroke="#9d8bd6" stroke-width="1.5"/><text x="355.0" y="202" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Signed</text><text x="355.0" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">−1</text><text x="240" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#27283f">255 − 256 = −1</text></g></svg>
