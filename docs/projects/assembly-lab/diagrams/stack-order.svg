<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 212" role="img" aria-labelledby="title desc"><title id="title">The newest slot is read first</title><desc id="desc">Push x=3 at 0x7ff8, then y=7 at 0x7ff0. RSP now points to y. The next pop retrieves 7, followed by 3.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="212" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">The newest slot is read first</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="93.33333333333333" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Address</text><text x="240.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Value</text><text x="386.66666666666663" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Read order</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x7ff0</text><text x="240.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">y = 7</text><text x="386.66666666666663" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">first</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">0x7ff8</text><text x="240.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">x = 3</text><text x="386.66666666666663" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">second</text></g></svg>
