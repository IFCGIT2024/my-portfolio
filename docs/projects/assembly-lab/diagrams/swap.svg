<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" role="img" aria-labelledby="title desc"><title id="title">A saved value makes swap work</title><desc id="desc">Initially X is 123 and Y is 456. After both loads, RAX preserves 123. After the first store both cells hold 456; the second store writes the saved 123 to Y. The pointer addresses never change.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#5a42b4"/></marker></defs><rect width="480" height="302" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="240" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#27283f">A saved value makes swap work</text><rect x="20" y="42" width="440" height="42" rx="7" fill="#292a43"/><text x="93.33333333333333" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Stage</text><text x="240.0" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">X / Y</text><text x="386.66666666666663" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">RAX</text><rect x="20" y="90" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Before</text><text x="240.0" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">123 / 456</text><text x="386.66666666666663" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">not set</text><rect x="20" y="135" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Both loads</text><text x="240.0" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">123 / 456</text><text x="386.66666666666663" y="164" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">123</text><rect x="20" y="180" width="440" height="43" fill="#f3f0ff"/><text x="93.33333333333333" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">First store</text><text x="240.0" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">456 / 456</text><text x="386.66666666666663" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">123</text><rect x="20" y="225" width="440" height="43" fill="#fff"/><text x="93.33333333333333" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">Second store</text><text x="240.0" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">456 / 123</text><text x="386.66666666666663" y="254" text-anchor="middle" font-size="20" font-weight="500" fill="#27283f">123</text></g></svg>
