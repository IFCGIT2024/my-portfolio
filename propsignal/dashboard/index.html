<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS Real Estate Deal Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  header {
    background: #1a1d27;
    border-bottom: 1px solid #2d3748;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; color: #f7fafc; }
  header .subtitle { font-size: 0.8rem; color: #718096; }

  .stats-bar {
    display: flex;
    gap: 16px;
    padding: 14px 24px;
    background: #151821;
    border-bottom: 1px solid #2d3748;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 90px;
  }
  .stat-val { font-size: 1.4rem; font-weight: 800; color: #63b3ed; }
  .stat-label { font-size: 0.68rem; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; }

  .controls {
    display: flex;
    gap: 10px;
    padding: 12px 24px;
    background: #1a1d27;
    border-bottom: 1px solid #2d3748;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input, .controls select {
    background: #0f1117;
    border: 1px solid #2d3748;
    color: #e2e8f0;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    outline: none;
  }
  .controls input:focus, .controls select:focus {
    border-color: #4a90d9;
  }
  .controls label { font-size: 0.78rem; color: #718096; }

  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .badge-investor  { background: #2b4c7e; color: #90cdf4; }
  .badge-flipper   { background: #44337a; color: #d6bcfa; }
  .badge-bank      { background: #742a2a; color: #fc8181; }
  .badge-below     { background: #1a365d; color: #63b3ed; }
  .badge-motivated { background: #744210; color: #f6ad55; }
  .badge-waterfront{ background: #1d4044; color: #81e6d9; }
  .badge-developer { background: #276749; color: #9ae6b4; }
  .badge-value     { background: #2d3748; color: #a0aec0; }
  .badge-lowconf   { background: #4a4a1a; color: #e2cd6e; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  thead th {
    background: #1a1d27;
    padding: 10px 12px;
    text-align: left;
    font-size: 0.72rem;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: #90cdf4; }
  thead th.sorted-asc::after  { content: " ▲"; color: #63b3ed; }
  thead th.sorted-desc::after { content: " ▼"; color: #63b3ed; }

  tbody tr {
    border-bottom: 1px solid #1e2330;
    cursor: pointer;
    transition: background 0.1s;
  }
  tbody tr:hover { background: #1e2330; }
  td { padding: 9px 12px; vertical-align: middle; }
  td.price   { font-weight: 700; color: #f7fafc; font-size: 0.9rem; }
  td.address { color: #cbd5e0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .score-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-weight: 800;
    font-size: 0.82rem;
  }

  .conf-bar {
    display: inline-block;
    height: 6px;
    background: #2d3748;
    border-radius: 3px;
    width: 60px;
    vertical-align: middle;
    position: relative;
    overflow: hidden;
  }
  .conf-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 3px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1d27;
    border: 1px solid #2d3748;
    border-radius: 12px;
    width: 700px;
    max-width: 95vw;
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px;
  }
  .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
  .modal .modal-price { font-size: 1.6rem; font-weight: 800; color: #63b3ed; margin-bottom: 14px; }
  .modal-close {
    float: right;
    background: none;
    border: none;
    color: #718096;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    margin-top: -4px;
  }
  .modal-close:hover { color: #fc8181; }

  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
    margin: 14px 0;
  }
  .modal-row { display: contents; }
  .modal-key   { color: #718096; font-size: 0.78rem; }
  .modal-val   { color: #e2e8f0; font-size: 0.82rem; font-weight: 500; }

  .breakdown-item {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #2d3748;
    font-size: 0.82rem;
  }
  .breakdown-item:last-child { border: none; }
  .pts-pos { color: #68d391; font-weight: 700; }
  .pts-neg { color: #fc8181; font-weight: 700; }

  .modal-section-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #4a5568;
    margin: 16px 0 6px;
  }

  .vp-link {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 18px;
    background: #2b6cb0;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .vp-link:hover { background: #3182ce; }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: #4a5568;
    font-size: 0.9rem;
  }

  .table-wrapper { overflow-x: auto; }
  .count-label { font-size: 0.78rem; color: #718096; margin-left: auto; padding-right: 8px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>NS Real Estate Deal Scanner</h1>
    <div class="subtitle">Scored &amp; ranked Nova Scotia property listings</div>
  </div>
  <div class="count-label" id="count-label"></div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat"><div class="stat-val" id="st-total">—</div><div class="stat-label">Total Listed</div></div>
  <div class="stat"><div class="stat-val" id="st-strong">—</div><div class="stat-label">Strong Leads (50+)</div></div>
  <div class="stat"><div class="stat-val" id="st-bank">—</div><div class="stat-label">Bank Owned</div></div>
  <div class="stat"><div class="stat-val" id="st-below">—</div><div class="stat-label">Below Assessment</div></div>
  <div class="stat"><div class="stat-val" id="st-avg">—</div><div class="stat-label">Avg Score</div></div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search address or area..." style="width:220px">

  <label>Segment:
    <select id="seg-filter">
      <option value="">All</option>
      <option value="investor_lead">Investor Lead</option>
      <option value="flipper_lead">Flipper Lead</option>
      <option value="bank_owned">Bank Owned</option>
      <option value="below_assessment">Below Assessment</option>
      <option value="motivated_seller">Motivated Seller</option>
      <option value="developer_lead">Developer Lead</option>
      <option value="waterfront">Waterfront</option>
      <option value="value_buyer">Value Buyer</option>
    </select>
  </label>

  <label>Min Score:
    <select id="score-filter">
      <option value="0">Any</option>
      <option value="30">30+</option>
      <option value="50" selected>50+</option>
      <option value="70">70+</option>
      <option value="90">90+</option>
    </select>
  </label>

  <label>Max Price:
    <select id="price-filter">
      <option value="">Any</option>
      <option value="100000">$100k</option>
      <option value="200000">$200k</option>
      <option value="350000">$350k</option>
      <option value="500000">$500k</option>
      <option value="750000">$750k</option>
    </select>
  </label>

  <label>Min Confidence:
    <select id="conf-filter">
      <option value="0">Any</option>
      <option value="50">50+</option>
      <option value="70">70+</option>
    </select>
  </label>
</div>

<div class="table-wrapper">
<table>
  <thead>
    <tr>
      <th data-col="deal_score" class="sorted-desc">Score</th>
      <th data-col="confidence_score">Conf</th>
      <th data-col="address">Address</th>
      <th data-col="list_price">Price</th>
      <th data-col="assessment_ratio">Ratio</th>
      <th data-col="relist_count">Relists</th>
      <th data-col="dom_total">DOM</th>
      <th data-col="price_per_sqft">$/sqft</th>
      <th data-col="views">Views</th>
      <th>Segments</th>
      <th data-col="bedrooms">Beds</th>
      <th data-col="building_sqft">Sqft</th>
      <th data-col="age">Age</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <h2 id="m-address"></h2>
    <div class="modal-price" id="m-price"></div>
    <div id="m-tags"></div>

    <div class="modal-grid" id="m-grid"></div>

    <div class="modal-section-title">Score Breakdown</div>
    <div id="m-breakdown"></div>

    <div class="modal-section-title">Assessment History</div>
    <div id="m-assessment" style="font-size:0.82rem; color:#a0aec0;"></div>

    <br>
    <a class="vp-link" id="m-vplink" href="#" target="_blank" rel="noopener">View on ViewPoint.ca →</a>
  </div>
</div>

<script src="data.js"></script>
<script>
let allDeals = [];
let stats = {};
let sortCol = "deal_score";
let sortDir = -1; // -1 = desc

// -----------------------------------------------------------------------
// Load data
// -----------------------------------------------------------------------
async function loadData() {
  if (typeof window.DEALS === 'undefined' || typeof window.STATS === 'undefined') {
    document.getElementById("tbody").innerHTML =
      `<tr><td colspan="13" class="no-results">
        data.js not found — run <strong>export_top_deals.py</strong> first, then reload this page.
      </td></tr>`;
    return;
  }
  allDeals = window.DEALS;
  stats    = window.STATS;

  renderStats();
  renderTable();
  setupControls();
}

// -----------------------------------------------------------------------
// Stats bar
// -----------------------------------------------------------------------
function renderStats() {
  document.getElementById("st-total").textContent  = (stats.total_properties || 0).toLocaleString();
  document.getElementById("st-strong").textContent = (stats.high_score_50plus || 0).toLocaleString();
  document.getElementById("st-bank").textContent   = (stats.bank_owned || 0).toLocaleString();
  document.getElementById("st-below").textContent  = (stats.below_assessment || 0).toLocaleString();
  document.getElementById("st-avg").textContent    = stats.avg_deal_score ?? "—";
}

// -----------------------------------------------------------------------
// Filters
// -----------------------------------------------------------------------
function getFiltered() {
  const search    = document.getElementById("search").value.toLowerCase();
  const seg       = document.getElementById("seg-filter").value;
  const minScore  = parseInt(document.getElementById("score-filter").value) || 0;
  const maxPrice  = parseInt(document.getElementById("price-filter").value) || Infinity;
  const minConf   = parseInt(document.getElementById("conf-filter").value) || 0;

  return allDeals.filter(d => {
    if (d.deal_score < minScore) return false;
    if (d.confidence_score < minConf) return false;
    if (d.list_price > maxPrice) return false;
    if (seg && !d.segment_tags.includes(seg)) return false;
    if (search && !(d.address || "").toLowerCase().includes(search)) return false;
    return true;
  });
}

// -----------------------------------------------------------------------
// Sort
// -----------------------------------------------------------------------
function sortDeals(deals) {
  return [...deals].sort((a, b) => {
    let av = a[sortCol] ?? (sortDir === -1 ? -Infinity : Infinity);
    let bv = b[sortCol] ?? (sortDir === -1 ? -Infinity : Infinity);
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    return av < bv ? sortDir : av > bv ? -sortDir : 0;
  });
}

// -----------------------------------------------------------------------
// Score pill colour
// -----------------------------------------------------------------------
function scorePill(score) {
  let bg, color;
  if (score >= 80) { bg = "#276749"; color = "#9ae6b4"; }
  else if (score >= 60) { bg = "#2b4c7e"; color = "#90cdf4"; }
  else if (score >= 40) { bg = "#744210"; color = "#f6ad55"; }
  else { bg = "#2d3748"; color = "#a0aec0"; }
  return `<span class="score-pill" style="background:${bg};color:${color}">${score}</span>`;
}

// -----------------------------------------------------------------------
// Confidence bar
// -----------------------------------------------------------------------
function confBar(conf) {
  const pct  = conf ?? 0;
  const color = pct >= 70 ? "#68d391" : pct >= 50 ? "#f6ad55" : "#fc8181";
  return `<span class="conf-bar"><span class="conf-fill" style="width:${pct}%;background:${color}"></span></span>
          <span style="font-size:0.72rem;color:#718096;margin-left:4px">${pct}</span>`;
}

// -----------------------------------------------------------------------
// Badge
// -----------------------------------------------------------------------
const BADGE_MAP = {
  investor_lead:  ["badge-investor",  "Investor"],
  flipper_lead:   ["badge-flipper",   "Flipper"],
  bank_owned:     ["badge-bank",      "Bank Owned"],
  below_assessment:["badge-below",   "Below Assess."],
  motivated_seller:["badge-motivated","Motivated"],
  developer_lead: ["badge-developer", "Developer"],
  waterfront:     ["badge-waterfront","Waterfront"],
  value_buyer:    ["badge-value",     "Value"],
  low_confidence: ["badge-lowconf",   "Low Conf"],
};

function renderBadges(tags) {
  return (tags || []).map(t => {
    const [cls, label] = BADGE_MAP[t] || ["badge-value", t];
    return `<span class="badge ${cls}">${label}</span>`;
  }).join(" ");
}

// -----------------------------------------------------------------------
// Render table
// -----------------------------------------------------------------------
function renderTable() {
  const filtered = sortDeals(getFiltered());
  document.getElementById("count-label").textContent =
    `Showing ${filtered.length} of ${allDeals.length} deals`;

  const tbody = document.getElementById("tbody");

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="13" class="no-results">No deals match these filters.</td></tr>`;
    return;
  }

  const fmt  = v => v != null ? `$${Math.round(v).toLocaleString()}` : "—";
  const n1   = v => v != null ? v.toFixed(1) : "—";
  const n2   = v => v != null ? v.toFixed(2) : "—";
  const intv = v => v != null ? Math.round(v).toLocaleString() : "—";

  tbody.innerHTML = filtered.map((d, i) => `
    <tr onclick="openModal(${i}, ${JSON.stringify(filtered.map(x=>x.cutsheet_url)).replace(/"/g,'&quot;')})">
      <td>${scorePill(d.deal_score)}</td>
      <td>${confBar(d.confidence_score)}</td>
      <td class="address" title="${d.address || ""}">${d.address || "—"}</td>
      <td class="price">${fmt(d.list_price)}</td>
      <td>${n2(d.assessment_ratio)}</td>
      <td>${d.relist_count ?? "—"}</td>
      <td>${d.dom_total ?? "—"}</td>
      <td>${d.price_per_sqft ? "$"+Math.round(d.price_per_sqft) : "—"}</td>
      <td>${intv(d.views)}</td>
      <td style="white-space:nowrap">${renderBadges(d.segment_tags)}</td>
      <td>${d.bedrooms ?? "—"}</td>
      <td>${d.building_sqft ? Math.round(d.building_sqft).toLocaleString() : "—"}</td>
      <td>${d.age ?? "—"}</td>
    </tr>
  `).join("");

  // Store filtered for modal access
  window._filteredDeals = filtered;
}

// -----------------------------------------------------------------------
// Modal
// -----------------------------------------------------------------------
function openModal(i) {
  const d = window._filteredDeals[i];
  if (!d) return;

  document.getElementById("m-address").textContent = d.address || "Unknown address";
  document.getElementById("m-price").textContent   = d.list_price ? "$"+Math.round(d.list_price).toLocaleString() : "—";
  document.getElementById("m-tags").innerHTML      = renderBadges(d.segment_tags);
  document.getElementById("m-vplink").href         = "https://viewpoint.ca" + d.cutsheet_url;

  // Grid of key facts
  const facts = [
    ["Deal Score", `${d.deal_score} / 100`],
    ["Confidence", `${d.confidence_score} / 100`],
    ["Bedrooms", d.bedrooms ?? "—"],
    ["Bathrooms", d.bathrooms ?? "—"],
    ["Sqft", d.building_sqft ? Math.round(d.building_sqft).toLocaleString() : "—"],
    ["$/sqft", d.price_per_sqft ? "$"+Math.round(d.price_per_sqft) : "—"],
    ["Age", d.age ? `${d.age} yrs` : "—"],
    ["Property Type", d.property_type ?? "—"],
    ["Foundation", d.foundation ?? "—"],
    ["Roof", d.roof ?? "—"],
    ["Water", d.drinking_water ?? "—"],
    ["Sewer", d.sewer ?? "—"],
    ["Heating", d.heating_cooling ?? "—"],
    ["Fuel", d.fuel_supply ?? "—"],
    ["Assessment", d.assessment_current ? "$"+Math.round(d.assessment_current).toLocaleString() : "—"],
    ["Assess. Ratio", d.assessment_ratio ? d.assessment_ratio.toFixed(2) : "—"],
    ["Tax/yr", d.tax_expense ? "$"+Math.round(d.tax_expense).toLocaleString() : "—"],
    ["Tax Rate", d.tax_rate ? (d.tax_rate*100).toFixed(3)+"%" : "—"],
    ["DOM Total", d.dom_total ?? "—"],
    ["Relists", d.relist_count ?? "—"],
    ["Price Drop", d.price_drop_total ? "$"+Math.round(d.price_drop_total).toLocaleString() : "—"],
    ["Sale/List Ratio", d.sale_to_list_ratio ? d.sale_to_list_ratio.toFixed(2) : "—"],
    ["Views", d.views?.toLocaleString() ?? "—"],
    ["Unique Users", d.unique_users?.toLocaleString() ?? "—"],
    ["Waterfront", d.waterfront ?? "—"],
    ["Zoning", d.zoning ?? "—"],
    ["Listed By", d.listed_by ?? "—"],
    ["Bank Owned", d.bank_owned === 1 ? "Yes" : "No"],
    ["Polling District", d.polling_district ?? "—"],
  ];

  document.getElementById("m-grid").innerHTML =
    facts.map(([k, v]) => `<div class="modal-key">${k}</div><div class="modal-val">${v}</div>`).join("");

  // Score breakdown
  const bd = d.score_reason_breakdown || [];
  document.getElementById("m-breakdown").innerHTML = bd.length
    ? bd.map(item => `
        <div class="breakdown-item">
          <span>${item.note || item.factor}</span>
          <span class="${item.points >= 0 ? "pts-pos" : "pts-neg"}">
            ${item.points >= 0 ? "+" : ""}${item.points}
          </span>
        </div>
      `).join("")
    : `<div style="color:#4a5568;font-size:0.82rem">No score factors — property may have insufficient data.</div>`;

  document.getElementById("m-assessment").textContent =
    d.historical_cutsheet_urls && d.historical_cutsheet_urls.length
      ? `${d.historical_cutsheet_urls.length} past listing(s) found`
      : "No historical listings on record";

  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal(e) {
  if (e.target === document.getElementById("modal-overlay")) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById("modal-overlay").classList.remove("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModalDirect(); });

// -----------------------------------------------------------------------
// Controls
// -----------------------------------------------------------------------
function setupControls() {
  ["search","seg-filter","score-filter","price-filter","conf-filter"].forEach(id => {
    document.getElementById(id).addEventListener("input", renderTable);
  });

  document.querySelectorAll("thead th[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir *= -1;
      } else {
        sortCol = col;
        sortDir = col === "address" ? 1 : -1;
      }
      document.querySelectorAll("thead th").forEach(h => {
        h.classList.remove("sorted-asc","sorted-desc");
      });
      th.classList.add(sortDir === -1 ? "sorted-desc" : "sorted-asc");
      renderTable();
    });
  });
}

// -----------------------------------------------------------------------
// Boot
// -----------------------------------------------------------------------
loadData();
</script>
</body>
</html>
